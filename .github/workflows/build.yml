name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Zip

      - name: Generate test media
        shell: pwsh
        run: ./_test/make_media.ps1

      - name: Run self checks
        shell: pwsh
        timeout-minutes: 20
        run: |
          # VideoCompare.exe 是 winexe（GUI 子系统）：直接 & 调用不会等待，必须 Start-Process 等它跑完
          $checks = @(
            @{ Name = 'selftest';  Out = 'dist\selftest.txt';  Timeout = 120; Args = @('--selftest',  '_test\media\01_h264_25fps.mp4', '_test\media\02_hevc_aac.mkv') },
            @{ Name = 'uicheck';   Out = 'dist\uicheck.txt';   Timeout = 120; Args = @('--uicheck',   '_test\media\01_h264_25fps.mp4', '_test\media\03_prores422.mov') },
            @{ Name = 'seektest';  Out = 'dist\seektest.txt';  Timeout = 180; Args = @('--seektest',  '_test\media\07_long_90s.mp4', '0.2,0.85,0.05,0.6,0.35,0.9,0.45') },
            @{ Name = 'clicktest'; Out = 'dist\clicktest.txt'; Timeout = 180; Args = @('--clicktest', '_test\media\07_long_90s.mp4', '0.9,0.1,0.9,0.1,0.5,0.95,0.05', '350') }
          )

          $failed = @()
          foreach ($c in $checks) {
            if (Test-Path $c.Out) { Remove-Item $c.Out -Force }
            Write-Host "==> $($c.Name)"
            $p = Start-Process -FilePath 'dist\VideoCompare.exe' -ArgumentList $c.Args -PassThru
            $deadline = (Get-Date).AddSeconds($c.Timeout)
            while (-not (Test-Path $c.Out) -and (Get-Date) -lt $deadline) {
              if ($p.HasExited -and -not (Test-Path $c.Out)) { Start-Sleep -Seconds 2; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $p.HasExited) { try { $p.WaitForExit(30000) | Out-Null } catch { } }
            if (-not $p.HasExited) { $p.Kill() }

            if (-not (Test-Path $c.Out)) {
              Write-Host "!! $($c.Name): no output file"
              $failed += $c.Name
              continue
            }
            Get-Content $c.Out
            if (-not (Select-String -Path $c.Out -Pattern 'RESULT_OK' -Quiet)) {
              Write-Host "!! $($c.Name): result not OK"
              $failed += $c.Name
            }
          }

          if ($failed.Count -gt 0) { throw "failed checks: $($failed -join ', ')" }

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: dist/*.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: video-compare-win-x64
          path: dist/video-compare-*-win-x64.zip

  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: video-compare-win-x64
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # 这个作业没有 checkout，必须显式 --repo，否则 gh 报 fatal: not a git repository
          gh release create "$GITHUB_REF_NAME" dist/video-compare-*-win-x64.zip \
            --repo "$REPO" \
            --title "视频对比工具 $GITHUB_REF_NAME" \
            --generate-notes
